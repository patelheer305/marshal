      height: 4px;

    function populateCrops(language) {
      cropSelect.innerHTML = `<option value="" disabled selected>${translations[language].cropPlaceholder}</option>`;
      for (const cropKey in crops) {
        const cropName = crops[cropKey][language].name;
        const option = document.createElement('option');
        option.value = cropKey;
        option.textContent = cropName;
        cropSelect.appendChild(option);
      }
    }

    function updateContent() {
      const selectedLanguage = languageSelect.value;
      const selectedCrop = cropSelect.value;

      // Update title and description
      titleElement.textContent = translations[selectedLanguage].title;
      descriptionElement.textContent = translations[selectedLanguage].description;

      // Update crop dropdown placeholder
      cropSelect.querySelector('option[value=""]').textContent = translations[selectedLanguage].cropPlaceholder;

      // Update crop content
      if (selectedCrop && crops[selectedCrop]) {
        const cropData = crops[selectedCrop][selectedLanguage];
        contentElement.innerHTML = `<ul>${cropData.content.map(item => `<li>${item}</li>`).join('')}</ul>`;
        contentElement.style.display = 'block';
      } else {
        contentElement.style.display = 'none';
      }
    }

    // Initialize
    populateCrops(languageSelect.value);
    updateContent();

    // Event listeners
    languageSelect.addEventListener('change', () => {
      const selectedLanguage = languageSelect.value;
      populateCrops(selectedLanguage);
      updateContent();
    });

    cropSelect.addEventListener('change', updateContent);
  </script>
</body>
</html>
